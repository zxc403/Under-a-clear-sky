<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MINISTOP · 便利店室外 / 室内漫游</title>
<style>
  :root{
    --bg:#0e1116; --panel:rgba(18,22,28,.82); --line:rgba(255,255,255,.12);
    --ink:#eef2f6; --dim:#98a2b0; --accent:#f2c53d; --accent2:#3d7ef2;
    --tap:rgba(255,255,255,.10); --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:fixed;z-index:5;pointer-events:none}
  .hud > *{pointer-events:auto}

  #top{top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .card{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px}
  #ttl{font-size:14px;font-weight:700;letter-spacing:.2px}
  #sub{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45;max-width:56vw}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tabs button{border:0;background:transparent;color:var(--dim);font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#221c05}

  #views{bottom:calc(14px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:6px;
    overflow-x:auto;padding:6px;scrollbar-width:none}
  #views::-webkit-scrollbar{display:none}
  #views button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);
    color:var(--ink);font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;font-family:inherit}
  #views button[aria-pressed="true"]{background:var(--accent);color:#221c05;border-color:transparent}
  #views button.ghost{color:var(--dim)}

  /* ---- walk controls ---- */
  #pad{position:fixed;z-index:6;bottom:calc(74px + env(safe-area-inset-bottom));left:16px;
    width:124px;height:124px;touch-action:none;display:none}
  #pad.on{display:block}
  #padBase{position:absolute;inset:0;border-radius:50%;background:rgba(18,22,28,.55);
    border:1px solid var(--line);backdrop-filter:blur(8px)}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:rgba(242,197,61,.92);box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #padHint{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:10.5px;
    color:var(--dim);white-space:nowrap}

  #msg{top:50%;left:50%;transform:translate(-50%,-50%);max-width:80vw;font-size:12.5px;line-height:1.6;
    background:rgba(140,30,30,.92);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 14px;display:none}
  #msg.on{display:block}
  #load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:var(--bg);transition:opacity .45s;font-size:13px;color:var(--dim)}
  #load.done{opacity:0;pointer-events:none}
  .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.16);
    border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #hint{position:fixed;z-index:5;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));
    font-size:10.5px;color:var(--dim);text-align:right;line-height:1.5;pointer-events:none}
  @media (max-width:520px){ #sub{max-width:70vw} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="top">
  <div class="card">
    <div id="ttl">MINISTOP · 便利店</div>
    <div id="sub">室外门头 / 室内漫游 · Blender Cycles 同源资产，AO 已烘焙进顶点色</div>
  </div>
  <div class="tabs" role="tablist" aria-label="场景切换">
    <button type="button" data-mode="out" aria-selected="true">室外</button>
    <button type="button" data-mode="in" aria-selected="false">室内漫游</button>
  </div>
</div>

<div id="hint"></div>
<div id="views" role="toolbar" aria-label="机位与操作"></div>

<div id="pad" role="group" aria-label="移动摇杆">
  <div id="padBase"></div>
  <div id="knob"></div>
  <div id="padHint">拖动移动</div>
</div>

<div class="hud" id="msg"></div>
<div id="load"><div style="text-align:center"><div class="ring"></div><div id="ltxt">正在加载模型…</div></div></div>

<script type="module">
import * as THREE from './libs/three.module.js';
import { OrbitControls } from './libs/addons/controls/OrbitControls.js';
import { GLTFLoader } from './libs/addons/loaders/GLTFLoader.js';

/* ============================================================
   Coordinate note: assets are glTF (Y-up). Blender (x,y,z)
   maps to glTF (x, z, -y).
   ============================================================ */

const ROOT = '/Under-a-clear-sky/shots/';

const MODES = {
  out: {
    file: './store_v2.glb',
    title: 'MINISTOP · 便利店 · 室外',
    sub: '精修 v2 门头 · 白瓷砖墙 / 黄蓝灯箱 / 条纹雨棚 / 门口三台设备',
    kind: 'orbit',
    views: [
      { id:'o1', name:'门头 hero', pos:[1.05,1.72,12.60], tgt:[0.30,1.95,-0.60], fov:33.4 },
      { id:'o2', name:'三设备', pos:[2.30,1.15,6.40],  tgt:[2.20,0.95,-3.90], fov:31.9 },
      { id:'o3', name:'全景',   pos:[-1.60,2.60,16.50], tgt:[-1.20,1.60,2.00], fov:30.0 }
    ],
    links: [
      { label:'门头 hero 渲染图', href: ROOT+'reconv2/hero.png' },
      { label:'设备特写渲染图',   href: ROOT+'reconv2/close.png' },
      { label:'全景渲染图',       href: ROOT+'reconv2/wide.png' }
    ]
  },
  in: {
    file: './int.glb',
    title: 'MINISTOP · 便利店 · 室内',
    sub: '冷藏柜墙 / 双面货架 / 收银台背柜 / 天花板灯管 / 水磨石地面',
    kind: 'walk',
    // Blender (x,y,z) -> glTF (x, z, -y)
    views: [
      { id:'i1', name:'主通道', pos:[0.00,1.58,2.05],  tgt:[0.00,1.05,-3.10] },
      { id:'i2', name:'门角视角', pos:[2.28,1.74,1.70], tgt:[-2.20,0.90,-2.20] },
      { id:'i3', name:'望向门口', pos:[-2.40,1.62,-1.20],tgt:[0.85,1.26,2.40] },
      { id:'i4', name:'全店俯瞰', pos:[-2.70,2.55,2.10], tgt:[1.30,0.80,-3.20] }
    ],
    links: [
      { label:'室内主通道渲染图', href: ROOT+'reconint/intA.png' },
      { label:'室内门角渲染图',   href: ROOT+'reconint/intB.png' },
      { label:'室内望向门口',     href: ROOT+'reconint/intC.png' },
      { label:'室内全店俯瞰',     href: ROOT+'reconint/intD.png' }
    ]
  }
};

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 400);

const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.minDistance = 1.2;
orbit.maxDistance = 90;
orbit.maxPolarAngle = Math.PI * 0.497;
orbit.enabled = true;

/* ---------- environment (PMREM from a gradient sky) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
{
  const sky = new THREE.Scene();
  const g = new THREE.SphereGeometry(50, 24, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{ top:{value:new THREE.Color(0xbcd7f2)}, bot:{value:new THREE.Color(0x6f6a5e)} },
    vertexShader:'varying vec3 vp; void main(){ vp=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'varying vec3 vp; uniform vec3 top; uniform vec3 bot; void main(){ float h=normalize(vp).y*0.5+0.5; gl_FragColor=vec4(mix(bot,top,smoothstep(0.35,0.85,h)),1.0); }'
  });
  sky.add(new THREE.Mesh(g, m));
  scene.environment = pmrem.fromScene(sky, 0.04).texture;
  sky.traverse(o => { if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
}

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xbcd2ea, 0x7a6a55, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe7c2, 2.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
{
  const sc = sun.shadow.camera;
  sc.near = 0.5; sc.far = 160; sc.left=-34; sc.right=34; sc.top=34; sc.bottom=-34;
}
scene.add(sun); scene.add(sun.target);

const fill = new THREE.DirectionalLight(0xdce8ff, 0.40);
fill.position.set(18, 12, -14);
scene.add(fill);

// interior practical lights (used only in walk mode)
const ins = [];
const inLightSpec = [
  [-2.00, 2.72,  0.70, 0xfff0d2, 9.0],
  [ 0.00, 2.72,  0.70, 0xfff0d2, 9.0],
  [ 2.00, 2.72,  0.70, 0xfff0d2, 9.0],
  [-2.00, 2.72, -1.90, 0xfff0d2, 9.0],
  [ 0.00, 2.72, -1.90, 0xfff0d2, 9.0],
  [ 2.00, 2.72, -1.90, 0xfff0d2, 9.0],
  // cold glow spilling out of the refrigerated wall (glTF Z = -3.25)
  [-1.60, 1.60, -2.60, 0xcfe6ff, 4.5],
  [ 1.60, 1.60, -2.60, 0xcfe6ff, 4.5]
];
for (const [x,y,z,col,inten] of inLightSpec){
  const pl = new THREE.PointLight(col, inten, 9.0, 2.0);
  pl.position.set(x,y,z);
  pl.visible = false;
  scene.add(pl); ins.push(pl);
}

/* ---------- walk room bounds (from the interior build) ---------- */
const ROOM = {
  minX:-2.70, maxX:2.70,
  minZ:-3.42, maxZ:2.10,
  eye:1.60
};

/* ---------- state ---------- */
const loader = new GLTFLoader();
let mode = 'out';
let current = null, currentKey = null, loading = false;

const elMsg=document.getElementById('msg'), elLoad=document.getElementById('load'),
      elLtxt=document.getElementById('ltxt'), elTtl=document.getElementById('ttl'),
      elSub=document.getElementById('sub'), elViews=document.getElementById('views'),
      elHint=document.getElementById('hint'), elPad=document.getElementById('pad');

function fail(t){ elMsg.textContent=t; elMsg.classList.add('on'); elLoad.classList.add('done'); }
function ok(){ elMsg.classList.remove('on'); }

function fit(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}

/* ---------- walk controller ---------- */
const walk = {
  yaw:0, pitch:0,
  pos:new THREE.Vector3(0, ROOM.eye, 0),
  vel:new THREE.Vector3(),
  jx:0, jz:0,
  active:false
};
function clampWalk(){
  walk.pos.x=Math.min(ROOM.maxX, Math.max(ROOM.minX, walk.pos.x));
  walk.pos.z=Math.min(ROOM.maxZ, Math.max(ROOM.minZ, walk.pos.z));
  walk.pos.y=ROOM.eye;
}
function walkLookAt(target){
  const d=new THREE.Vector3().subVectors(target, walk.pos);
  walk.yaw=Math.atan2(-d.x, -d.z);
  walk.pitch=Math.atan2(d.y, Math.hypot(d.x,d.z));
}
function applyWalkCamera(){
  camera.position.copy(walk.pos);
  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
}

/* look-drag on the canvas (walk mode only) */
let look=null;
canvas.addEventListener('pointerdown', e=>{
  if (mode!=='in') return;
  look={ x:e.clientX, y:e.clientY };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if (!look || mode!=='in') return;
  const dx=e.clientX-look.x, dy=e.clientY-look.y;
  look.x=e.clientX; look.y=e.clientY;
  walk.yaw   -= dx*0.0042;
  walk.pitch -= dy*0.0034;
  walk.pitch = Math.max(-1.15, Math.min(1.15, walk.pitch));
  walkLookLocked=true;
  applyWalkCamera();
});
canvas.addEventListener('pointerup', e=>{ look=null; try{canvas.releasePointerCapture(e.pointerId);}catch(_){} });
canvas.addEventListener('pointercancel', ()=>{ look=null; });
let walkLookLocked=false;

/* keyboard */
const keys=new Set();
window.addEventListener('keydown', e=>{ keys.add(e.key.toLowerCase()); });
window.addEventListener('keyup',   e=>{ keys.delete(e.key.toLowerCase()); });

/* joystick */
const pad=document.getElementById('pad'), knob=document.getElementById('knob');
let padId=null, padC=null;
function padVec(e){
  const r=pad.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2);
  const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  walk.jx=dx; walk.jz=dy;
  knob.style.transform='translate('+(dx*36)+'px,'+(dy*36)+'px)';
}
pad.addEventListener('pointerdown', e=>{ padId=e.pointerId; padC=e.clientX; padVec(e); pad.setPointerCapture(e.pointerId); });
pad.addEventListener('pointermove', e=>{ if(padId===e.pointerId) padVec(e); });
function padEnd(e){
  if(padId!==e.pointerId) return;
  padId=null; walk.jx=0; walk.jz=0; knob.style.transform='translate(0,0)';
  try{pad.releasePointerCapture(e.pointerId);}catch(_){}
}
pad.addEventListener('pointerup', padEnd);
pad.addEventListener('pointercancel', padEnd);

/* ---------- chrome ---------- */
function buildChrome(){
  const m=MODES[mode];
  elTtl.textContent=m.title;
  elSub.textContent=m.sub;
  elHint.innerHTML = m.kind==='walk'
    ? '拖动屏幕 转向<br>左下摇杆 移动<br>键盘 WASD / 方向键'
    : '拖动 旋转<br>双指 缩放<br>滚轮 缩放';
  elPad.classList.toggle('on', m.kind==='walk');

  elViews.innerHTML='';
  for (const v of m.views){
    const b=document.createElement('button');
    b.type='button'; b.textContent=v.name;
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click', ()=>applyView(v, true));
    elViews.appendChild(b);
  }
  {
    const sep=document.createElement('div'); sep.style.cssText='flex:0 0 1px;background:var(--line);margin:0 2px';
    elViews.appendChild(sep);
  }
  for (const l of m.links){
    const a=document.createElement('a');
    a.href=l.href; a.target='_blank'; a.rel='noopener';
    a.textContent=l.label;
    a.style.cssText='flex:0 0 auto;border:1px solid var(--line);background:rgba(18,22,28,.72);color:var(--ink);font-size:12px;padding:9px 13px;border-radius:999px;text-decoration:none;font-weight:600';
    elViews.appendChild(a);
  }
  {
    const sep=document.createElement('div'); sep.style.cssText='flex:0 0 1px;background:var(--line);margin:0 2px';
    elViews.appendChild(sep);
  }
  const home=document.createElement('button');
  home.type='button'; home.className='ghost'; home.textContent='复位';
  home.addEventListener('click', ()=>applyView(m.views[0], true));
  elViews.appendChild(home);

  document.querySelectorAll('.tabs button').forEach(b=>{
    b.setAttribute('aria-selected', String(b.dataset.mode===mode));
  });
}

function markView(id){
  [...elViews.querySelectorAll('button')].forEach(b=>{
    if (!b.dataset.vid) return;
    b.setAttribute('aria-pressed', String(b.dataset.vid===id));
  });
}

function applyView(v, instant){
  const m=MODES[mode];
  if (m.kind==='orbit'){
    camera.fov=v.fov||45; camera.updateProjectionMatrix();
    const p=new THREE.Vector3().fromArray(v.pos), t=new THREE.Vector3().fromArray(v.tgt);
    camera.position.copy(p); orbit.target.copy(t); orbit.update();
  } else {
    const p=new THREE.Vector3().fromArray(v.pos), t=new THREE.Vector3().fromArray(v.tgt);
    walk.pos.copy(p); clampWalk();
    camera.fov=45; camera.updateProjectionMatrix();
    walkLookAt(t); applyWalkCamera();
  }
  // tag buttons with their view id so markView can highlight
  [...elViews.querySelectorAll('button')].forEach((b,i)=>{ b.dataset.vid=v.id; });
  markView(v.id);
}

function setMode(next){
  if (next===mode) return;
  mode=next;
  const m=MODES[mode];
  const isWalk = m.kind==='walk';
  orbit.enabled=!isWalk;
  if (isWalk){ orbit.enabled=false; } else { orbit.enabled=true; }
  if (currentKey!==mode){ load(mode); }
  else { buildChrome(); applyView(m.views[0], true); }
}

/* ---------- load ---------- */
function load(key){
  if (loading) return;
  const m=MODES[key];
  loading=true; currentKey=key; mode=key;
  for (const l of ins) l.visible = (m.kind==='walk');
  buildChrome();
  elLoad.classList.remove('done');
  elLtxt.textContent='正在加载 '+m.title+' …';

  loader.load(m.file, gltf=>{
    ok();
    if (current){
      scene.remove(current);
      current.traverse(o=>{
        if (o.geometry) o.geometry.dispose();
        if (o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(x=>x.dispose());
      });
    }
    current=gltf.scene;
    current.traverse(o=>{
      if (o.isMesh){
        o.castShadow=true; o.receiveShadow=true;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for (const mm of mats){
          if (!mm) continue;
          if ('envMapIntensity' in mm) mm.envMapIntensity = (m.kind==='walk') ? 0.45 : 0.60;
        }
      }
    });
    scene.add(current);

    const box=new THREE.Box3().setFromObject(current);
    const c=box.getCenter(new THREE.Vector3());
    sun.target.position.copy(c);
    sun.position.set(c.x+15.2, c.y+24.0, c.z+28.0);
    sun.target.updateMatrixWorld();

    if (m.kind==='walk'){
      orbit.enabled=false;
      ins.forEach(l=>l.visible=true);
      applyView(m.views[0], true);
    } else {
      orbit.enabled=true;
      applyView(m.views[0], true);
    }
    loading=false;
    elLoad.classList.add('done');
  }, ev=>{
    if (ev && ev.total) elLtxt.textContent='正在加载 … '+Math.round(ev.loaded/ev.total*100)+'%';
  }, err=>{
    console.error(err);
    loading=false;
    fail('模型加载失败：'+m.file+'（请确认 int.glb / store_v2.glb 与本页同目录，并经 http(s) 打开）');
  });
}

document.querySelectorAll('.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>setMode(b.dataset.mode));
});

window.addEventListener('resize', fit);
window.addEventListener('error', e=>{ if(!elMsg.classList.contains('on')) fail('脚本错误：'+(e.message||'unknown')); });
window.addEventListener('unhandledrejection', e=>{ if(!elMsg.classList.contains('on')) fail('运行错误：'+((e.reason&&e.reason.message)||e.reason)); });

/* ---------- loop ---------- */
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(), 0.05);

  if (mode==='in'){
    // input vector from joystick + keyboard
    let ix=walk.jx, iz=walk.jz;
    if (keys.has('a')||keys.has('arrowleft'))  ix-=1;
    if (keys.has('d')||keys.has('arrowright')) ix+=1;
    if (keys.has('w')||keys.has('arrowup'))    iz-=1;
    if (keys.has('s')||keys.has('arrowdown'))  iz+=1;
    const mag=Math.hypot(ix,iz);
    if (mag>1){ ix/=mag; iz/=mag; }

    if (mag>0.001){
      const speed=2.1;
      const fwd=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0, walk.yaw, 0));
      const rgt=new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0, walk.yaw, 0));
      walk.pos.addScaledVector(fwd, -iz*speed*dt);
      walk.pos.addScaledVector(rgt,  ix*speed*dt);
      clampWalk();
      applyWalkCamera();
      walkLookLocked=false;
    }
  } else {
    orbit.update();
  }
  renderer.render(scene, camera);
}

fit();
load('out');
tick();
</script>
</body>
</html>

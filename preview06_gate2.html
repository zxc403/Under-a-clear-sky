<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bcdcf5}
#hud{position:fixed;left:10px;top:10px;right:10px;color:#fff;
font:12px/1.65 system-ui,-apple-system,sans-serif;
background:rgba(14,36,62,.55);padding:9px 12px;border-radius:9px;pointer-events:none;z-index:5}
#hud b{font-weight:600;font-size:13px}
#hud span{opacity:.85}
#msg{position:fixed;left:10px;bottom:10px;right:10px;color:#fff;
font:12px/1.6 ui-monospace,monospace;background:rgba(122,18,18,.85);
padding:10px 12px;border-radius:9px;display:none;white-space:pre-wrap;z-index:6}

<body>
<div id="hud"><b>06号便利店 · 第二关验收：招牌 + 雨棚</b><br>
<span>招牌＝黄蓝灯箱（实体进深 18cm）· 雨棚＝红白竖条（前伸 1.1m，前缘灯泡串 + 两根斜撑）<br>
墙面沿用第一关白瓷砖标准 · 灰色方块 = 1 米 · 拖动旋转 / 双指缩放</span></div>
<div id="msg"></div>

<script>
function err(t){var m=document.getElementById('msg');m.style.display='block';m.textContent=t;}
window.addEventListener('error',e=>{err('✗ 脚本错误: '+(e.message||'')+'\n'+(e.filename||'')+':'+(e.lineno||''))},true);
window.addEventListener('unhandledrejection',e=>{err('✗ 加载失败: '+((e.reason&&(e.reason.message||e.reason))||'未知'))});
var ok=false;
setTimeout(()=>{if(!ok)err('✗ 20 秒内未启动渲染，请把这段提示截图发我。')},20000);
</script>

<script type="importmap">
{"imports":{"three":"./libs/three.module.js","three/addons/":"./libs/addons/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   全部贴图：确定性绘制，无随机噪声
   白瓷砖 = 复用第一关标准（16×16 块 / 2.40m / 砖 15cm）
   ============================================================ */
const TILES=16, TILE_M=0.15, SPAN_M=TILES*TILE_M;   // 2.40m
const COL_GROUT='#D6D2CA', COL_TILE=[242,240,234];

function rand(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 白瓷砖 ---------- */
function makeTileTexture(px){
  const c=document.createElement('canvas'); c.width=c.height=px;
  const g=c.getContext('2d');
  const step=px/TILES, grout=Math.max(1.6,px/900);
  g.fillStyle=COL_GROUT; g.fillRect(0,0,px,px);
  const rnd=rand(20260910);
  for(let r=0;r<TILES;r++)for(let q=0;q<TILES;q++){
    const j=Math.round((rnd()-0.5)*4);
    g.fillStyle=`rgb(${COL_TILE[0]+j},${COL_TILE[1]+j},${COL_TILE[2]+j})`;
    const x0=q*step+grout/2, y0=r*step+grout/2, w=step-grout, h=step-grout;
    g.fillRect(x0,y0,w,h);
    g.strokeStyle='rgba(255,255,255,0.55)'; g.lineWidth=Math.max(1,px/1400);
    g.beginPath(); g.moveTo(x0,y0+h); g.lineTo(x0,y0); g.lineTo(x0+w,y0); g.stroke();
    g.strokeStyle='rgba(176,170,158,0.40)';
    g.beginPath(); g.moveTo(x0+w,y0); g.lineTo(x0+w,y0+h); g.lineTo(x0,y0+h); g.stroke();
    g.fillStyle='rgba(255,255,255,0.06)';
    g.fillRect(x0+w*0.18,y0+h*0.18,w*0.64,h*0.64);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8;
  return t;
}

/* ---------- MINISTOP 灯箱招牌面 ---------- */
function makeSignTexture(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  const CU='#0B4EA2';   // 蓝
  const YE='#FFD200';   // 黄
  const WH='#FBF9F4';   // 白

  // 白底 + 深蓝外描边
  g.fillStyle=WH; g.fillRect(0,0,w,h);
  g.strokeStyle=CU; g.lineWidth=Math.round(h*0.055);
  g.strokeRect(g.lineWidth/2, g.lineWidth/2, w-g.lineWidth, h-g.lineWidth);

  // 上蓝带
  const blueH=Math.round(h*0.155);
  g.fillStyle=CU; g.fillRect(0,0,w,blueH);
  // 下黄带
  const yelH=Math.round(h*0.235);
  g.fillStyle=YE; g.fillRect(0,h-yelH,w,yelH);
  // 黄蓝交界细线
  g.fillStyle=CU; g.fillRect(0,h-yelH-Math.round(h*0.02),w,Math.round(h*0.02));

  // 中央品名：MINISTOP
  const midY=h*0.5;
  const fs=Math.round(h*0.40);
  g.font=`900 ${fs}px "Arial Black",Arial,"Helvetica Neue",sans-serif`;
  g.textAlign='center'; g.textBaseline='middle';
  // 字距手绘：逐字符绘制
  const word='MINISTOP';
  const gap=fs*0.055;
  let total=0; const widths=[];
  for(const ch of word){const ww=g.measureText(ch).width; widths.push(ww); total+=ww+gap;}
  total-=gap;
  let cx=w/2-total/2;
  g.fillStyle=CU;
  word.split('').forEach((ch,i)=>{ g.fillText(ch,cx+widths[i]/2,midY); cx+=widths[i]+gap; });

  // 左下小字 24H
  g.textAlign='left';
  g.font=`700 ${Math.round(h*0.13)}px Arial,sans-serif`;
  g.fillStyle=CU;
  g.fillText('24H', Math.round(w*0.05), h-yelH/2);

  // 右下小字 CONVENIENCE
  g.textAlign='right';
  g.fillStyle='#E9E6DE';
  g.fillText('CONVENIENCE', w-Math.round(w*0.04), blueH/2);

  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}

/* ---------- 红白竖条纹（雨棚） ---------- */
function makeStripeTexture(px,stripes){
  const c=document.createElement('canvas'); c.width=px; c.height=64;
  const g=c.getContext('2d');
  const sw=px/stripes;
  for(let i=0;i<stripes;i++){
    g.fillStyle = (i%2===0) ? '#D8232A' : '#F5F3EE';
    g.fillRect(i*sw,0,sw+1,64);
  }
  // 织物极淡横向织纹（规则线条，非噪点）
  g.globalAlpha=0.05; g.fillStyle='#000';
  for(let y=2;y<64;y+=4) g.fillRect(0,y,px,1);
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8;
  return t;
}

function strut(a,b,r,mat){
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),mat);
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  m.castShadow=true;
  return m;
}

try{
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const scene=new THREE.Scene();

  // 天空
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(400,32,16),
    new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
      uniforms:{top:{value:new THREE.Color(0x5FA8E8)},bottom:{value:new THREE.Color(0xDCEDFB)}},
      vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:'varying vec3 vP;uniform vec3 top;uniform vec3 bottom;void main(){float k=clamp((normalize(vP).y*0.5+0.5),0.0,1.0);gl_FragColor=vec4(mix(bottom,top,pow(k,0.75)),1.0);}'})
  ));

  // 光照
  scene.add(new THREE.HemisphereLight(0xDCEDFB,0xA79E90,1.15));
  const sun=new THREE.DirectionalLight(0xFFF3E2,2.4);
  sun.position.set(-7,10,6); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=0.5; sun.shadow.camera.far=45;
  sun.shadow.camera.left=-9; sun.shadow.camera.right=9;
  sun.shadow.camera.top=9;   sun.shadow.camera.bottom=-5;
  sun.shadow.bias=-0.0006;
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0xBFD4E8,0.35).translateX(6).translateY(3).translateZ(-6));

  // 地面
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),
    new THREE.MeshStandardMaterial({color:0xB9B4AA,roughness:0.95}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

  /* ================= 墙体（白瓷砖，沿用第一关标准） ================= */
  const WALL_W=6.0, WALL_H=4.2, WALL_T=0.24, Z0=WALL_T/2;  // 正面在 z=+0.12

  const tileTex=makeTileTexture(1024);
  tileTex.repeat.set(WALL_W/SPAN_M, WALL_H/SPAN_M);
  const tileMat=new THREE.MeshStandardMaterial({map:tileTex,roughness:0.42,metalness:0,envMapIntensity:0.5});
  const sideMat=new THREE.MeshStandardMaterial({color:0xE7E2D9,roughness:0.92});

  const wall=new THREE.Mesh(new THREE.BoxGeometry(WALL_W,WALL_H,WALL_T),
    [sideMat,sideMat,sideMat,sideMat,tileMat,sideMat]);
  wall.position.set(0,WALL_H/2,0);
  wall.castShadow=true; wall.receiveShadow=true;
  scene.add(wall);

  /* ================= 店面开口：深色玻璃带 + 门 ================= */
  const glassMat=new THREE.MeshStandardMaterial({color:0x2B4152,roughness:0.12,metalness:0.35,
    envMapIntensity:1.0});
  const frameMat=new THREE.MeshStandardMaterial({color:0xCFCAC0,roughness:0.6,metalness:0.3});

  // 玻璃窗带（左段）
  const winW=2.5, winH=2.05, winY=1.15;
  const win=new THREE.Mesh(new THREE.BoxGeometry(winW,winH,0.06),glassMat);
  win.position.set(-1.55,winY,Z0+0.02); win.receiveShadow=true; scene.add(win);
  const winFrame=new THREE.Mesh(new THREE.BoxGeometry(winW+0.12,winH+0.12,0.05),frameMat);
  winFrame.position.set(-1.55,winY,Z0-0.01); scene.add(winFrame);

  // 玻璃门（右段）
  const doorW=1.3, doorH=2.15, doorY=1.08;
  const door=new THREE.Mesh(new THREE.BoxGeometry(doorW,doorH,0.07),glassMat);
  door.position.set(1.35,doorY,Z0+0.03); scene.add(door);
  const doorFrame=new THREE.Mesh(new THREE.BoxGeometry(doorW+0.14,doorH+0.12,0.06),frameMat);
  doorFrame.position.set(1.35,doorY,Z0); scene.add(doorFrame);
  const doorBar=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.9,0.05),frameMat);
  doorBar.position.set(0.95,1.05,Z0+0.09); scene.add(doorBar);

  // 门楣（玻璃带上方一条横梁，撑住雨棚）
  const header=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.28,WALL_T+0.08),sideMat);
  header.position.set(0,2.42,0); header.castShadow=true; scene.add(header);

  /* ================= 招牌灯箱 ================= */
  const SIGN_W=4.30, SIGN_H=0.95, SIGN_T=0.18;
  const signY=3.28, signZ=Z0+SIGN_T/2+0.02;

  const signTex=makeSignTexture(2048,Math.round(2048*SIGN_H/SIGN_W));
  const signFace=new THREE.MeshStandardMaterial({
    map:signTex, emissive:0xffffff, emissiveMap:signTex, emissiveIntensity:0.34,
    roughness:0.5, metalness:0.0
  });
  const signBody=new THREE.MeshStandardMaterial({color:0xE9E6DE,roughness:0.7});

  const sign=new THREE.Mesh(new THREE.BoxGeometry(SIGN_W,SIGN_H,SIGN_T),
    [signBody,signBody,signBody,signBody,signFace,signBody]);
  sign.position.set(0,signY,signZ);
  sign.castShadow=true; sign.receiveShadow=true;
  scene.add(sign);

  // 招牌两侧支架（短撑，接墙）
  const braceMat=new THREE.MeshStandardMaterial({color:0x9AA0A6,roughness:0.5,metalness:0.6});
  [-1,1].forEach(s=>{
    const a=new THREE.Vector3(s*(SIGN_W/2-0.15), signY-0.32, Z0);
    const b=new THREE.Vector3(s*(SIGN_W/2-0.15), signY-0.05, signZ+SIGN_T/2-0.02);
    scene.add(strut(a,b,0.028,braceMat));
  });

  /* ================= 雨棚（红白竖条 + 灯泡串 + 斜撑） ================= */
  const AWN_W=4.9, AWN_D=1.15, AWN_TOP=2.26, TILT=0.20; // 约 11.5°
  const awning=new THREE.Group();
  awning.position.set(0,AWN_TOP,Z0);
  scene.add(awning);

  const stripeTex=makeStripeTexture(1024,14);
  stripeTex.repeat.set(AWN_D/0.9,1);
  const stripeMat=new THREE.MeshStandardMaterial({map:stripeTex,roughness:0.85,side:THREE.DoubleSide});
  const underMat=new THREE.MeshStandardMaterial({color:0x8E2A28,roughness:0.9,side:THREE.DoubleSide});

  // 棚顶板
  const canopy=new THREE.Mesh(new THREE.BoxGeometry(AWN_W,0.04,AWN_D),
    [stripeMat,stripeMat,stripeMat,underMat,stripeMat,stripeMat]);
  canopy.position.set(0,0,AWN_D/2);
  canopy.castShadow=true; canopy.receiveShadow=true;
  awning.add(canopy);
  awning.rotation.x=TILT;

  // 前缘垂帘（valance）
  const valH=0.30;
  const valTex=makeStripeTexture(1024,14);
  valTex.repeat.set(AWN_W/0.9,1);
  const valMat=new THREE.MeshStandardMaterial({map:valTex,roughness:0.85,side:THREE.DoubleSide});
  const valance=new THREE.Mesh(new THREE.BoxGeometry(AWN_W,valH,0.03),
    [valMat,valMat,valMat,valMat,valMat,valMat]);
  const frontPos=new THREE.Vector3(0,-AWN_D*Math.sin(TILT),AWN_D*Math.cos(TILT));
  valance.position.set(0,-valH/2-0.02,0);
  const valGroup=new THREE.Group();
  valGroup.position.copy(frontPos); valGroup.rotation.x=-TILT;
  valGroup.add(valance); valGroup.castShadow=true;
  awning.add(valGroup);

  // 前缘灯泡串（实体小球，微发光）
  const bulbMat=new THREE.MeshStandardMaterial({color:0xFFF2C4,emissive:0xFFE9A8,emissiveIntensity:1.5,roughness:0.3});
  const NBULB=13;
  for(let i=0;i<NBULB;i++){
    const bx=-AWN_W/2+0.28+i*((AWN_W-0.56)/(NBULB-1));
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.035,12,10),bulbMat);
    b.position.set(bx,-valH-0.05,0.02);
    valGroup.add(b);
  }

  // 斜撑杆（从墙脚上方 × 到雨棚前角）
  const strutMat=new THREE.MeshStandardMaterial({color:0xB8BCC0,roughness:0.45,metalness:0.65});
  [-1,1].forEach(s=>{
    const wallPt=new THREE.Vector3(s*(AWN_W/2-0.18), AWN_TOP-0.72, Z0+0.02);
    const outPt =new THREE.Vector3(s*(AWN_W/2-0.18),
      AWN_TOP-AWN_D*Math.sin(TILT)-0.03,
      Z0+AWN_D*Math.cos(TILT)-0.05);
    scene.add(strut(wallPt,outPt,0.026,strutMat));
  });

  /* ================= 1 米参考方块 ================= */
  const refBox=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({color:0x8E8A82,roughness:0.9,transparent:true,opacity:0.5}));
  refBox.position.set(-3.5,0.5,1.5); refBox.castShadow=true; refBox.receiveShadow=true;
  scene.add(refBox);
  const refEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
    new THREE.LineBasicMaterial({color:0x4A463F}));
  refEdge.position.copy(refBox.position); scene.add(refEdge);

  /* ================= 相机 ================= */
  const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,1000);
  camera.position.set(1.2,2.1,7.2);

  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,2.3,0);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.minDistance=1.2; controls.maxDistance=20;
  controls.maxPolarAngle=Math.PI*0.495;
  controls.update();

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
  ok=true;
}catch(e){
  err('✗ 初始化失败: '+(e&&(e.message||e)));
}
</script>
</body>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>06号便利店 · 第一关 · 白瓷砖墙</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bcdcf5}
#hud{position:fixed;left:10px;top:10px;right:10px;color:#fff;
font:12px/1.65 system-ui,-apple-system,sans-serif;
background:rgba(14,36,62,.55);padding:9px 12px;border-radius:9px;pointer-events:none;z-index:5}
#hud b{font-weight:600;font-size:13px}
#hud span{opacity:.85}
#msg{position:fixed;left:10px;bottom:10px;right:10px;color:#fff;
font:12px/1.6 ui-monospace,monospace;background:rgba(122,18,18,.85);
padding:10px 12px;border-radius:9px;display:none;white-space:pre-wrap;z-index:6}
</style>
</head>
<body>
<div id="hud"><b>06号便利店 · 第一关验收：白瓷砖墙</b><br>
<span>单块砖 15cm · 亮白砖面 #F2F0EA · 浅灰细缝 #D6D2CA · 无噪点<br>
地面灰色参考方块 = 1 米（用来核对砖块大小）· 拖动旋转 / 双指缩放</span></div>
<div id="msg"></div>

<script>
function err(t){var m=document.getElementById('msg');m.style.display='block';m.textContent=t;}
window.addEventListener('error',e=>{err('✗ 脚本错误: '+(e.message||'')+'\n'+(e.filename||'')+':'+(e.lineno||''))},true);
window.addEventListener('unhandledrejection',e=>{err('✗ 加载失败: '+((e.reason&&(e.reason.message||e.reason))||'未知'))});
var ok=false;
setTimeout(()=>{if(!ok)err('✗ 20 秒内未启动渲染，请把这段提示截图发我。')},20000);
</script>

<script type="importmap">
{"imports":{"three":"./libs/three.module.js","three/addons/":"./libs/addons/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   确定性瓷砖贴图：全部用规则绘制，无随机噪声
   画布 = 16 x 16 块砖，单块 15cm  => 画布代表 2.40m x 2.40m 的真实面积
   ============================================================ */
const TILES = 16;          // 每边砖数
const TILE_M = 0.15;       // 单块砖边长（米）
const SPAN_M = TILES * TILE_M;   // 2.40m

const COL_GROUT = '#D6D2CA';     // 浅灰细缝
const COL_TILE  = [242,240,234]; // 亮白砖面基准

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeTileTexture(px){
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const g = c.getContext('2d');
  const step = px / TILES;                 // 每块砖像素
  const grout = Math.max(1.6, px / 900);   // 细缝宽度

  // 砖缝底色（整面先铺浅灰，再逐块盖上砖面）
  g.fillStyle = COL_GROUT;
  g.fillRect(0,0,px,px);

  const rnd = mulberry32(20260910);        // 固定种子 => 每次完全一致
  const cell = Math.floor(step);
  for(let r=0;r<TILES;r++){
    for(let q=0;q<TILES;q++){
      // 极轻微的单砖明度差（±2），模拟真实釉面砖批次差，不是噪点
      const j = Math.round((rnd()-0.5)*4);
      const base = `rgb(${COL_TILE[0]+j},${COL_TILE[1]+j},${COL_TILE[2]+j})`;
      const x = q*step, y = r*step;
      const x0 = x + grout/2, y0 = y + grout/2;
      const w = step - grout, h = step - grout;

      // 砖面
      g.fillStyle = base;
      g.fillRect(x0,y0,w,h);

      // 釉面高光（左上）与暗边（右下）：只做两像素级，避免方格感
      g.strokeStyle = 'rgba(255,255,255,0.55)';
      g.lineWidth = Math.max(1, px/1400);
      g.beginPath(); g.moveTo(x0,y0+h); g.lineTo(x0,y0); g.lineTo(x0+w,y0); g.stroke();

      g.strokeStyle = 'rgba(176,170,158,0.40)';
      g.beginPath(); g.moveTo(x0+w,y0); g.lineTo(x0+w,y0+h); g.lineTo(x0,y0+h); g.stroke();

      // 砖面正中几乎看不见的极淡雾面，防止塑料感
      g.fillStyle = 'rgba(255,255,255,0.06)';
      g.fillRect(x0+w*0.18, y0+h*0.18, w*0.64, h*0.64);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

try{
  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  // 天空渐变
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(400, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite:false,
      uniforms:{ top:{value:new THREE.Color(0x5FA8E8)}, bottom:{value:new THREE.Color(0xDCEDFB)} },
      vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:'varying vec3 vP; uniform vec3 top; uniform vec3 bottom; void main(){ float k=clamp((normalize(vP).y*0.5+0.5),0.0,1.0); gl_FragColor=vec4(mix(bottom,top,pow(k,0.75)),1.0); }'
    })
  );
  scene.add(sky);

  // 光照：晴日
  scene.add(new THREE.HemisphereLight(0xDCEDFB, 0xA79E90, 1.15));
  const sun = new THREE.DirectionalLight(0xFFF3E2, 2.4);
  sun.position.set(-6, 9, 5.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 40;
  sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
  sun.shadow.camera.top = 8;   sun.shadow.camera.bottom = -4;
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0xBFD4E8, 0.35).translateX(6).translateY(3).translateZ(-6));

  // 地面（浅灰混凝土，不抢墙的注意力）
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60,60),
    new THREE.MeshStandardMaterial({color:0xB9B4AA, roughness:0.95, metalness:0.0})
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  /* ---------- 白瓷砖墙本体 ---------- */
  const WALL_W = 4.50, WALL_H = 2.70, WALL_T = 0.24;

  const tileTex = makeTileTexture(1024);
  tileTex.repeat.set(WALL_W / SPAN_M, WALL_H / SPAN_M);

  const tileMat = new THREE.MeshStandardMaterial({
    map: tileTex, roughness:0.42, metalness:0.0,
    color:0xffffff, envMapIntensity:0.5
  });
  const sideMat = new THREE.MeshStandardMaterial({color:0xE7E2D9, roughness:0.92});

  // Box 面序：+x,-x,+y,-y,+z,-z  —— 正面(+z)贴瓷砖，其余为抹灰侧边
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_W, WALL_H, WALL_T),
    [sideMat, sideMat, sideMat, sideMat, tileMat, sideMat]
  );
  wall.position.set(0, WALL_H/2, 0);
  wall.castShadow = true; wall.receiveShadow = true;
  scene.add(wall);

  // 墙脚收边（一条浅灰压条，让墙落地更真实）
  const plinth = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_W + 0.06, 0.09, WALL_T + 0.06),
    new THREE.MeshStandardMaterial({color:0xCFCAC0, roughness:0.8})
  );
  plinth.position.set(0, 0.045, 0);
  plinth.castShadow = true; plinth.receiveShadow = true;
  scene.add(plinth);

  /* ---------- 1 米参考方块（核对砖块尺寸用）---------- */
  const refBox = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({color:0x8E8A82, roughness:0.9, transparent:true, opacity:0.55})
  );
  refBox.position.set(-2.6, 0.5, 1.3);
  refBox.castShadow = true; refBox.receiveShadow = true;
  scene.add(refBox);
  const refEdge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
    new THREE.LineBasicMaterial({color:0x4A463F})
  );
  refEdge.position.copy(refBox.position);
  scene.add(refEdge);

  /* ---------- 相机 ---------- */
  const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0.6, 1.55, 4.6);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.35, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.8;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.update();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function loop(){
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();

  ok = true;
}catch(e){
  err('✗ 初始化失败: ' + (e && (e.message||e)));
}
</script>
</body>
</html>
